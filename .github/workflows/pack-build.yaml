name: PackStore unsigned validation
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: pack-validation
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Set Pack build version
      run: python3 .pack/set_build_version.py
      env:
        PACK_RUN_NUMBER: ${{ github.run_number }}
        PACK_RUN_ATTEMPT: ${{ github.run_attempt }}
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
      with:
        distribution: temurin
        java-version: '21'
    - name: Build full-feature release
      run: ./gradlew --no-daemon assembleFullDefaultRelease
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: PackStore-unsigned
        path: app/build/outputs/apk/**/*.apk
        if-no-files-found: error
        retention-days: 1
      if: ${{ false }}
    - name: Stage exact unsigned APK
      run: python3 .pack/stage_unsigned.py
    - name: Enable KVM for isolated emulator
      run: test -e /dev/kvm && sudo chmod a+rw /dev/kvm
    - name: Android 15 emulator smoke
      timeout-minutes: 20
      uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
      with:
        api-level: 35
        arch: x86_64
        target: google_apis
        cores: 2
        ram-size: 2048M
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
        script: python3 .pack/emulator_smoke.py PackStore
    - name: Keep unsigned output in owner-only draft release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: 'set -eu

        gh release create "unsigned-${{ github.run_id }}-${{ github.run_attempt }}" pack-unsigned/* --draft --title "UNSIGNED
        development build ${{ github.run_number }}.${{ github.run_attempt }}" --notes "Unverified unsigned build for local
        signing and testing. Not a finished app release. Source commit: ${{ github.sha }}"'
    permissions:
      contents: write
